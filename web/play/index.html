<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Historical Knowledge Centres — Play</title>
<link rel="stylesheet" href="glkote.css"><link rel="stylesheet" href="dialog.css">
<style>html,body{margin:0;width:100%;height:100%;background:#090b0a;color:#d8e1dc}body{font-family:ui-monospace,monospace}#gameport{position:relative;width:100%;height:100vh;min-height:100vh}#windowport{position:absolute;inset:0}.loading{padding:1rem;position:relative;z-index:2}</style>
<script src="jquery-1.12.4.min.js"></script><script src="glkote.min.js"></script><script src="quixe.min.js"></script><script src="resourcemap.js"></script>
<style>
/* Mobile readability overrides for the generated GlkOte/Quixe UI. */
#gameport,#windowport,.WindowFrame,.BufferWindow,.GridWindow{background:#0b0e0d!important;color:#e8e2d6!important;}
.WindowFrame,.BufferWindow,.GridWindow,.BufferLine,.Style_normal,.Style_user1,.Style_user2{color:#e8e2d6!important;}
.Input,.InputLine,.Style_input{color:#f0c66d!important;}
.WindowFrame a,.BufferWindow a{color:#f0c66d!important;}
#loadingpane,#errorpane{background:#0b0e0d!important;color:#e8e2d6!important;}
</style>
</head>
<body><div id="gameport"><div id="windowport"></div><div id="loadingpane" class="loading">HISTORICAL KNOWLEDGE CENTRES // loading…</div><div id="errorpane" style="display:none"><div id="errorcontent"></div></div></div>
<script>
(function(){
  var box=document.querySelector(".loading");
  function show(msg){ if(box) box.textContent="RUNTIME DIAGNOSTIC // "+msg; }
  window.addEventListener("error",function(e){show("ERROR: "+(e.message||"unknown")+" @ "+(e.filename||"script")+":"+(e.lineno||"?"));});
  window.addEventListener("unhandledrejection",function(e){show("PROMISE: "+String(e.reason||"unknown"));});
  window.addEventListener("load",function(){
    show("starting story; Quixe="+(!!window.Quixe)+" GiLoad="+(!!window.GiLoad)+" GlkOte="+(!!window.GlkOte)+" payload="+(!!window.__latticeStoryBase64));
    try {
      if(!window.GiLoad) throw new Error("GiLoad missing");
      if(!window.__latticeStoryBase64) throw new Error("story payload missing");
      GiLoad.load_run(null,window.__latticeStoryBase64,"base64");
    } catch(e) { show("START ERROR: "+e.name+": "+e.message); return; }
    setTimeout(function(){
      if(box && /RUNTIME DIAGNOSTIC/.test(box.textContent)) show("startup returned but UI stalled");
    },3000);
  });
})();
</script>
<script src="reconstruction.js"></script></body></html>
