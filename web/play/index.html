<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Historical Knowledge Centres — Play</title>
<link rel="stylesheet" href="glkote.css"><link rel="stylesheet" href="dialog.css">
<style>html,body{margin:0;min-height:100%;background:#090b0a;color:#d8e1dc}body{font-family:ui-monospace,monospace}#gameport{min-height:100vh}.loading{padding:1rem}</style>
<script src="jquery-1.12.4.min.js"></script><script src="glkote.min.js"></script><script src="quixe.min.js"></script><script src="resourcemap.js"></script>
</head>
<body><div id="gameport"><div class="loading">HISTORICAL KNOWLEDGE CENTRES // loading…</div></div>
<script>
(function(){
  var box=document.querySelector(".loading");
  function show(msg){ if(box) box.textContent="RUNTIME DIAGNOSTIC // "+msg; }
  window.addEventListener("error",function(e){show("ERROR: "+(e.message||"unknown")+" @ "+(e.filename||"script")+":"+(e.lineno||"?"));});
  window.addEventListener("unhandledrejection",function(e){show("PROMISE: "+String(e.reason||"unknown"));});
  window.addEventListener("load",function(){\n    show("starting story; Quixe="+(!!window.Quixe)+" GiLoad="+(!!window.GiLoad)+" GlkOte="+(!!window.GlkOte)+" payload="+(!!window.__latticeStoryBase64));\n    try {\n      if(!window.GiLoad) throw new Error("GiLoad missing");\n      if(!window.__latticeStoryBase64) throw new Error("story payload missing");\n      GiLoad.load_run(null,window.__latticeStoryBase64,"base64");\n    } catch(e) { show("START ERROR: "+e.name+": "+e.message); return; }\n    setTimeout(function(){\n      if(box && /RUNTIME DIAGNOSTIC/.test(box.textContent)) show("startup returned but UI stalled");\n    },3000);\n  });
})();
</script>\n<script src="reconstruction.js"></script></body></html>
